# compare-search 部署
#
# 只需要挂载一个 /data 目录：settings.json（搜索引擎配置）与 cookie_115.txt 都由程序自己生成。

services:
  compare-search:
    image: ${IMAGE:-liubangjian/compare-search}:${TAG:-latest}
    container_name: compare-search
    restart: unless-stopped

    ports:
      # 18899 = 面板；18898 往下 8 个 = 各搜索引擎的代理端口（每个引擎占一个）
      - "${PORT_RANGE:-18891-18899}:18891-18899"

    environment:
      # 只是首次启动的初值；之后以页面上「设置」里保存的为准（写在 /data/settings.json）
      SRC1_BASE: ${SRC1_BASE:-http://192.0.2.20:11510}
      SRC2_BASE: ${SRC2_BASE:-http://192.0.2.20:8787}
      TZ: ${TZ:-Asia/Shanghai}

    volumes:
      # 换宿主机目录就改 DATA_DIR（默认当前目录下的 ./data）
      - ${DATA_DIR:-./data}:/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
