<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双引擎搜索</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 14px;
        }
        .container {
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 28px);
            max-width: 1800px;
            margin: 0 auto;
            padding: 14px 16px 16px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        /* ---------- 顶部检索区 ---------- */
        .searchbar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 8px;
        }
        #kwInput {
            flex: 1 1 380px;
            min-height: 40px;
            max-height: 132px;
            padding: 9px 12px;
            font: inherit;
            font-size: 0.88rem;
            line-height: 1.5;
            color: #1f2937;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        #kwInput:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.12);
        }
        .btn {
            padding: 9px 16px;
            font: inherit;
            font-size: 0.86rem;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn:hover { border-color: #0066cc; color: #0066cc; background: #ebf5ff; }
        .btn-primary {
            color: #fff;
            background: #0066cc;
            border-color: #0066cc;
            font-weight: 600;
        }
        .btn-primary:hover { background: #0055aa; border-color: #0055aa; color: #fff; }
        .btn[disabled] { opacity: 0.45; cursor: not-allowed; }

        /* ---------- 翻页器 ---------- */
        .pager {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding: 6px 10px;
            font-size: 0.82rem;
            color: #334155;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        .pager[hidden] { display: none; }
        .pager button {
            padding: 4px 11px;
            font: inherit;
            font-size: 0.8rem;
            color: #334155;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .pager button:hover:not(:disabled) { color: #0066cc; border-color: #0066cc; background: #ebf5ff; }
        .pager button:disabled { opacity: 0.45; cursor: not-allowed; }
        .pager-info { font-variant-numeric: tabular-nums; color: #64748b; }
        .pager-kw { color: #64748b; word-break: break-all; }
        .pager-kw b { color: #0f172a; }

        /* ---------- 主体三栏 ---------- */
        .layout {
            --codes-width: 216px;
            flex: 1;
            display: flex;
            gap: 0;
            min-height: 460px;
        }
        .results-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }
        .panel-header {
            padding: 6px 12px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
        }
        .panel iframe { flex: 1; width: 100%; border: 0; background: #fff; }

        /* 拖拽手柄 */
        .splitter {
            flex: 0 0 7px;
            cursor: col-resize;
            position: relative;
            background: transparent;
        }
        .splitter::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 3px;
            width: 1px;
            background: #e2e8f0;
        }
        .splitter:hover::after, .splitter.dragging::after { background: #0066cc; width: 2px; left: 2px; }

        .codes-col {
            flex: 0 0 var(--codes-width);
            display: flex;
            flex-direction: column;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            min-width: 0;
        }
        .codes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
        }
        .codes-header .count { color: #94a3b8; font-weight: 400; }
        .codes-header .actions { display: flex; gap: 4px; }
        .clear-btn {
            padding: 3px 8px;
            font: inherit;
            font-size: 0.75rem;
            font-weight: 400;
            color: #334155;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .clear-btn:hover { background: #ebf5ff; border-color: #0066cc; color: #0066cc; }
        .list-box {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .list-empty {
            padding: 10px 6px;
            color: #94a3b8;
            font-size: 0.8rem;
            line-height: 1.7;
        }
        .data-line {
            display: block;
            padding: 6px 9px;
            color: #0066cc;
            text-decoration: none;
            font-size: 0.85rem;
            border-radius: 4px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 3px solid transparent;
            transition: all 0.15s ease;
            word-break: break-all;
            cursor: pointer;
        }
        .data-line:hover { background: #ebf5ff; border-color: #0066cc; }
        /* 当前正在查看的那一条 */
        .data-line.current {
            color: #0f172a;
            font-weight: 600;
            background: #ebf5ff;
            border-color: #b5d4f4;
            border-left-color: #0066cc;
        }
        /* 已经看过的（含当前） */
        .data-line.clicked { color: #dc2626; border-color: #fca5a5; background: #fef2f2; }
        .data-line.clicked.current { color: #b91c1c; background: #fee2e2; border-left-color: #dc2626; }

        .codes-toggle {
            flex: 0 0 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 4px;
            padding: 0;
            font: inherit;
            font-size: 0.75rem;
            color: #64748b;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            writing-mode: vertical-rl;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }
        .codes-toggle:hover { color: #0066cc; border-color: #0066cc; background: #ebf5ff; }
        .layout.codes-collapsed .codes-col { flex-basis: 0; border-width: 0; }
        .layout.codes-collapsed .splitter { display: none; }

        /* ---------- 设置对话框 ---------- */
        dialog.settings {
            width: min(560px, calc(100vw - 32px));
            padding: 0;
            border: 0;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.22);
            color: #1f2937;
            font-family: inherit;
        }
        dialog.settings::backdrop { background: rgba(15, 23, 42, 0.35); }
        dialog.settings .body { padding: 20px 22px 18px; }
        dialog.settings h2 {
            margin: 0 0 4px;
            font-size: 1rem;
            font-weight: 600;
        }
        dialog.settings .sub {
            margin: 0 0 16px;
            font-size: 0.8rem;
            color: #64748b;
            line-height: 1.6;
        }
        dialog.settings label {
            display: block;
            margin-bottom: 12px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #334155;
        }
        dialog.settings input[type="text"] {
            display: block;
            width: 100%;
            margin-top: 5px;
            padding: 9px 11px;
            font: inherit;
            font-size: 0.86rem;
            font-weight: 400;
            color: #1f2937;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }
        dialog.settings input[type="text"]:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.12);
        }
        .hint {
            margin: 0;
            min-height: 1.4em;
            font-size: 0.78rem;
            line-height: 1.6;
            color: #64748b;
            word-break: break-all;
        }
        .hint.error { color: #dc2626; }
        .hint.ok { color: #0f6e56; }
        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }
    </style>
</head>
<body data-p1-port="{P1PORT}">
    <script id="bootstrap" type="application/json">{BOOTSTRAP}</script>

    <div class="container">
        <div class="searchbar">
            <textarea id="kwInput" spellcheck="false"
                placeholder="一行一个番号；可一次粘贴多个，用换行分隔（也支持逗号 / 分号）。点「检索」后右侧会列出全部番号，点任意一条即可看它的结果。快捷键 Ctrl+Enter 检索，Alt+← / Alt+→ 翻页"></textarea>
            <button id="searchBtn" class="btn btn-primary" type="button">检索</button>
            <button id="settingsBtn" class="btn" type="button">设置</button>
        </div>

        <div class="pager" id="pager" hidden>
            <button id="prevBtn" type="button">← 上一个</button>
            <span class="pager-info" id="pagerInfo">0 / 0</span>
            <button id="nextBtn" type="button">下一个 →</button>
            <span class="pager-kw">当前：<b id="pagerKw"></b></span>
        </div>

        <div class="layout" id="layout">
            <div class="results-col">
                <div class="panel">
                    <div class="panel-header">搜索结果1</div>
                    <iframe id="frame1" src="about:blank"></iframe>
                </div>
                <div class="panel">
                    <div class="panel-header">搜索结果2</div>
                    <iframe id="frame2" src="about:blank"></iframe>
                </div>
            </div>

            <div class="splitter" id="splitter" title="拖动调整宽度，双击复位"></div>

            <div class="codes-col" id="codesCol">
                <div class="codes-header">
                    <span>番号 <span class="count" id="codesCount">0</span></span>
                    <span class="actions">
                        <button class="clear-btn" id="clearBtn" type="button">清空</button>
                    </span>
                </div>
                <div class="list-box" id="listBox"></div>
            </div>

            <button class="codes-toggle" id="codesToggle" type="button" title="收起 / 展开番号栏">收起</button>
        </div>
    </div>

    <dialog class="settings" id="settingsDialog">
        <div class="body">
            <h2>上游地址设置</h2>
            <p class="sub">保存后立即生效，并写入配置文件持久化。部署参数（端口、监听地址）仍需通过环境变量设置。</p>
            <label>源1 地址
                <input id="src1Input" type="text" spellcheck="false" placeholder="http://192.0.2.20:11510">
            </label>
            <label>源2 地址
                <input id="src2Input" type="text" spellcheck="false" placeholder="http://192.0.2.20:8787">
            </label>
            <p class="hint" id="settingsHint"></p>
            <div class="dialog-actions">
                <button class="btn" id="settingsCancel" type="button">取消</button>
                <button class="btn btn-primary" id="settingsSave" type="button">保存并生效</button>
            </div>
        </div>
    </dialog>

    <script>
{SCRIPT}
    </script>
</body>
</html>
