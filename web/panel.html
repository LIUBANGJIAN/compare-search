<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多引擎搜索</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 14px;
        }
        .container {
            display: flex;
            flex-direction: column;
            /* 固定为视口高度：这样番号栏内部才会滚动，而不是把整页撑长 */
            height: calc(100vh - 28px);
            max-width: 1800px;
            margin: 0 auto;
            padding: 14px 16px 16px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        /* ---------- 顶部检索区 ---------- */
        .searchbar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 8px;
            flex: 0 0 auto;
        }
        #kwInput {
            flex: 1 1 380px;
            min-height: 40px;
            max-height: 132px;
            padding: 9px 12px;
            font: inherit;
            font-size: 0.88rem;
            line-height: 1.5;
            color: #1f2937;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        #kwInput:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.12);
        }
        .btn {
            padding: 9px 16px;
            font: inherit;
            font-size: 0.86rem;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn:hover { border-color: #0066cc; color: #0066cc; background: #ebf5ff; }
        .btn-primary { color: #fff; background: #0066cc; border-color: #0066cc; font-weight: 600; }
        .btn-primary:hover { background: #0055aa; border-color: #0055aa; color: #fff; }
        .btn[disabled] { opacity: 0.45; cursor: not-allowed; }

        /* ---------- 翻页控件（放在番号栏里，省出上方空间） ---------- */
        .codes-pager {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 5px 8px;
            background: #fcfdfe;
            border-bottom: 1px solid #e2e8f0;
            flex: 0 0 auto;
        }
        .codes-pager[hidden] { display: none; }
        .codes-pager button {
            width: 30px;
            height: 24px;
            padding: 0;
            font: inherit;
            font-size: 1rem;
            line-height: 1;
            color: #334155;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .codes-pager button:hover:not(:disabled) { color: #0066cc; border-color: #0066cc; background: #ebf5ff; }
        .codes-pager button:disabled { opacity: 0.4; cursor: not-allowed; }
        .codes-pager .pager-info {
            font-size: 0.78rem;
            font-variant-numeric: tabular-nums;
            color: #64748b;
            white-space: nowrap;
        }

        /* ---------- 主体三栏 ---------- */
        .layout {
            --codes-width: 216px;
            flex: 1 1 auto;
            display: flex;
            gap: 0;
            min-height: 0;   /* 关键：flex 子项默认 min-height:auto，不置 0 就撑高整页 */
        }
        .results-col {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .panel {
            flex: 1 1 0;
            display: flex;
            flex-direction: column;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            min-height: 170px;
        }
        .panel-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 6px 12px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.85rem;
            color: #334155;
            flex: 0 0 auto;
        }
        .panel-header .eng-name { font-weight: 600; }
        .panel-header .eng-base {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 400;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .frame-wrap { position: relative; flex: 1 1 auto; min-height: 0; }
        .frame-wrap iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #fff;
            /* 预取槽位用 visibility 隐藏：display:none 在部分浏览器会暂停加载 */
            visibility: hidden;
        }
        .frame-wrap iframe.engine-frame-active { visibility: visible; }
        .frame-status {
            position: absolute;
            top: 8px;
            right: 10px;
            padding: 3px 10px;
            font-size: 0.75rem;
            color: #0066cc;
            background: rgba(235, 245, 255, 0.95);
            border: 1px solid #b5d4f4;
            border-radius: 999px;
            pointer-events: none;
        }
        .frame-status[hidden] { display: none; }

        /* 拖拽手柄 */
        .splitter {
            flex: 0 0 7px;
            cursor: col-resize;
            position: relative;
            background: transparent;
        }
        .splitter::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 3px;
            width: 1px;
            background: #e2e8f0;
        }
        .splitter:hover::after, .splitter.dragging::after { background: #0066cc; width: 2px; left: 2px; }

        .codes-col {
            flex: 0 0 var(--codes-width);
            display: flex;
            flex-direction: column;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            min-width: 0;
            min-height: 0;   /* 让内部 .list-box 自己滚动 */
        }
        .codes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            flex: 0 0 auto;
        }
        .codes-header .count { color: #94a3b8; font-weight: 400; }
        .clear-btn {
            padding: 3px 8px;
            font: inherit;
            font-size: 0.75rem;
            font-weight: 400;
            color: #334155;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .clear-btn:hover { background: #ebf5ff; border-color: #0066cc; color: #0066cc; }
        .list-box {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;      /* 番号多时在这里滚动，不撑长页面 */
            overscroll-behavior: contain;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .list-empty { padding: 10px 6px; color: #94a3b8; font-size: 0.8rem; line-height: 1.7; flex: 0 0 auto; }
        .data-line {
            display: block;
            padding: 6px 9px;
            color: #0066cc;
            text-decoration: none;
            font-size: 0.85rem;
            border-radius: 4px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 3px solid transparent;
            transition: all 0.15s ease;
            word-break: break-all;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .data-line:hover { background: #ebf5ff; border-color: #0066cc; }
        .data-line.current {
            color: #0f172a;
            font-weight: 600;
            background: #ebf5ff;
            border-color: #b5d4f4;
            border-left-color: #0066cc;
        }
        .data-line.clicked { color: #dc2626; border-color: #fca5a5; background: #fef2f2; }
        .data-line.clicked.current { color: #b91c1c; background: #fee2e2; border-left-color: #dc2626; }

        /* 右侧竖条：收起/展开 + 收起状态下的迷你翻页 */
        .codes-rail {
            flex: 0 0 26px;
            align-self: stretch;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-left: 4px;
        }
        .codes-toggle {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font: inherit;
            font-size: 0.75rem;
            color: #64748b;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            writing-mode: vertical-rl;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }
        .codes-toggle:hover { color: #0066cc; border-color: #0066cc; background: #ebf5ff; }
        .mini-nav {
            display: none;
            flex: 0 0 26px;
            padding: 0;
            font: inherit;
            font-size: 1rem;
            line-height: 1;
            color: #334155;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .mini-nav:hover:not(:disabled) { color: #0066cc; border-color: #0066cc; background: #ebf5ff; }
        .mini-nav:disabled { opacity: 0.4; cursor: not-allowed; }
        /* 番号栏收起后，翻页按钮挪到右侧竖条里，仍然能翻 */
        .layout.codes-collapsed .mini-nav { display: block; }
        .layout.codes-collapsed .codes-col { flex-basis: 0; border-width: 0; }
        .layout.codes-collapsed .splitter { display: none; }

        /* ---------- 设置对话框 ---------- */
        dialog.settings {
            width: min(780px, calc(100vw - 32px));
            max-height: 86vh;
            padding: 0;
            border: 0;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.22);
            color: #1f2937;
            font-family: inherit;
            overflow: hidden;
        }
        dialog.settings::backdrop { background: rgba(15, 23, 42, 0.35); }
        dialog.settings .body { display: flex; flex-direction: column; max-height: 86vh; padding: 20px 22px 16px; }
        dialog.settings h2 { margin: 0 0 4px; font-size: 1rem; font-weight: 600; }
        dialog.settings .sub { margin: 0 0 14px; font-size: 0.8rem; color: #64748b; line-height: 1.6; }
        dialog.settings code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; font-size: 0.78rem; }
        .direct-box {
            margin: 0 0 14px;
            padding: 10px 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        .direct-label { display: block; font-size: 0.75rem; font-weight: 600; color: #64748b; margin-bottom: 5px; }
        .direct-box code#directLink {
            display: block;
            font-size: 0.8rem;
            color: #0f172a;
            background: #fff;
            padding: 6px 8px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            word-break: break-all;
            user-select: all;
        }
        .direct-note { display: block; margin-top: 5px; font-size: 0.72rem; color: #94a3b8; line-height: 1.6; }
        .direct-note code { background: #eef2f7; }
        #engineList { flex: 1 1 auto; overflow-y: auto; min-height: 0; padding-right: 2px; }
        .engine-row {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
            background: #fcfdfe;
        }
        .engine-row .row-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }

        /* 启用开关：关掉后该引擎不参与检索 */
        .switch {
            position: relative;
            flex: 0 0 auto;
            width: 38px;
            height: 22px;
            margin-top: 18px;
            cursor: pointer;
        }
        .switch input {
            position: absolute;
            width: 0;
            height: 0;
            opacity: 0;
        }
        .switch-track {
            position: absolute;
            inset: 0;
            background: #cbd5e1;
            border-radius: 999px;
            transition: background 0.2s ease;
        }
        .switch-track::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.25);
            transition: transform 0.2s ease;
        }
        .switch input:checked + .switch-track { background: #16a34a; }
        .switch input:checked + .switch-track::after { transform: translateX(16px); }
        .switch input:focus-visible + .switch-track { box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.25); }
        /* 停用的行只把「内容」变淡，开关本身保持清晰 */
        .engine-row.is-off .f-name,
        .engine-row.is-off .f-base,
        .engine-row.is-off .f-path,
        .engine-row.is-off details { opacity: 0.5; }

        .engines-summary {
            align-self: center;
            font-size: 0.76rem;
            color: #64748b;
            white-space: nowrap;
        }
        .engine-row label { display: block; font-size: 0.75rem; font-weight: 600; color: #64748b; }
        .engine-row input[type="text"], .engine-row textarea {
            display: block;
            width: 100%;
            margin-top: 4px;
            padding: 7px 9px;
            font: inherit;
            font-size: 0.84rem;
            font-weight: 400;
            color: #1f2937;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
        }
        .engine-row input[type="text"]:focus, .engine-row textarea:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.12);
        }
        .engine-row textarea { resize: vertical; min-height: 54px; font-size: 0.78rem; line-height: 1.5; }
        .f-name { flex: 0 0 150px; }
        .f-base { flex: 1 1 260px; }
        .f-path { flex: 0 0 120px; }
        .engine-row details { margin-top: 8px; }
        .engine-row summary { font-size: 0.76rem; color: #64748b; cursor: pointer; user-select: none; }
        .field-help {
            margin: 6px 0 8px;
            font-size: 0.74rem;
            color: #64748b;
            line-height: 1.75;
        }
        .field-help b { color: #334155; font-weight: 600; }
        .css-presets {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }
        .preset-label { font-size: 0.75rem; font-weight: 600; color: #64748b; }
        .preset-btn {
            padding: 4px 10px;
            font: inherit;
            font-size: 0.75rem;
            color: #334155;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .preset-btn:hover { border-color: #0066cc; color: #0066cc; background: #ebf5ff; }
        .del-btn {
            flex: 0 0 auto;
            margin-top: 18px;
            padding: 7px 10px;
            font: inherit;
            font-size: 0.78rem;
            color: #b91c1c;
            background: #fff;
            border: 1px solid #fca5a5;
            border-radius: 7px;
            cursor: pointer;
        }
        .del-btn:hover { background: #fef2f2; }
        .hint { margin: 0; min-height: 1.4em; font-size: 0.78rem; line-height: 1.6; color: #64748b; word-break: break-all; }
        .hint.error { color: #dc2626; }
        .hint.ok { color: #0f6e56; }
        .dialog-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
            flex: 0 0 auto;
        }
        .dialog-actions .spacer { flex: 1 1 auto; }
    </style>
</head>
<body>
    <script id="bootstrap" type="application/json">{BOOTSTRAP}</script>

    <div class="container">
        <div class="searchbar">
            <textarea id="kwInput" spellcheck="false"
                placeholder="一行一个番号；可一次粘贴多个，用换行分隔（也支持逗号 / 分号）。点「检索」后右侧会列出全部番号，点任意一条即可看它的结果。快捷键 Ctrl+Enter 检索，Alt+← / Alt+→ 翻页"></textarea>
            <button id="searchBtn" class="btn btn-primary" type="button">检索</button>
            <button id="settingsBtn" class="btn" type="button">设置</button>
        </div>

        <div class="layout" id="layout">
            <div class="results-col" id="resultsCol"></div>

            <div class="splitter" id="splitter" title="拖动调整宽度，双击复位"></div>

            <div class="codes-col" id="codesCol">
                <div class="codes-header">
                    <span>番号 <span class="count" id="codesCount">0</span></span>
                    <span><button class="clear-btn" id="clearBtn" type="button">清空</button></span>
                </div>
                <div class="codes-pager" id="pager" hidden>
                    <button id="prevBtn" type="button" title="上一个（Alt+←）">‹</button>
                    <span class="pager-info" id="pagerInfo">0 / 0</span>
                    <button id="nextBtn" type="button" title="下一个（Alt+→）">›</button>
                </div>
                <div class="list-box" id="listBox"></div>
            </div>

            <div class="codes-rail">
                <button class="codes-toggle" id="codesToggle" type="button" title="收起 / 展开番号栏">收起</button>
                <button class="mini-nav" id="miniPrev" type="button" title="上一个">‹</button>
                <button class="mini-nav" id="miniNext" type="button" title="下一个">›</button>
            </div>
        </div>
    </div>

    <dialog class="settings" id="settingsDialog">
        <div class="body">
            <h2>搜索引擎设置</h2>
            <p class="sub">可添加任意多个搜索引擎。保存后立即生效并写入配置文件持久化。
                搜索路径是引擎自己的检索地址，程序会自动在后面追加 <code>?q=关键字</code>。</p>
            <div class="direct-box">
                <span class="direct-label">带关键字直接检索（其它程序对接 / 浏览器书签都用这一个地址）</span>
                <code id="directLink"></code>
                <span class="direct-note">把「关键字」三个字换成你要搜的内容即可，也支持 <code>?keyword=</code> / <code>?kw=</code> 写法</span>
            </div>
            <div id="engineList"></div>
            <p class="hint" id="settingsHint"></p>
            <div class="dialog-actions">
                <button class="btn" id="addEngineBtn" type="button">+ 新增搜索引擎</button>
                <span class="engines-summary" id="enginesSummary"></span>
                <span class="spacer"></span>
                <button class="btn" id="settingsCancel" type="button">取消</button>
                <button class="btn btn-primary" id="settingsSave" type="button">保存并生效</button>
            </div>
        </div>
    </dialog>

    <script>
{SCRIPT}
    </script>
</body>
</html>
